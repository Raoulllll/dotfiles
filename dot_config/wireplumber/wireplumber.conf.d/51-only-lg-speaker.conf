monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.usb-*" } ]
    actions = { update-props = { node.disabled = true } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_03_00.1.hdmi-stereo" } ]
    actions = { update-props = { node.disabled = true } }
  }
  {
    matches = [ { node.name = "~alsa_input.usb-Sony_Interactive_Entertainment_DualSense*" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
